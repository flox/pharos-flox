# gatkcondaenv adapted for linux-aarch64 (64-bit ARM Linux).
#
# Derived from GATK 4.6.2.0's official gatkcondaenv.yml.template with the two
# Intel-only lines dropped, exactly as gatkcondaenv.macos.yml does and for the
# same reason: MKL is an Intel library and conda-forge publishes no aarch64 build
# of it, on either OS ("mkl" has 0 linux-aarch64 builds).
#
#   - conda-forge::blas=1.0=mkl             MKL has no linux-aarch64 build
#   - conda-forge::pytorch=2.1.0=*mkl*100   MKL-flavored build string, x86-only
#
# conda-forge's linux-aarch64 pytorch 2.1.0 is published as cpu_generic_py310*,
# which links OpenBLAS, so the BLAS pin is omitted and pytorch is pinned by
# version only.
#
# The macOS port makes two further substitutions that this file deliberately does
# NOT copy. Both were forced by what bioconda publishes for osx-arm64, and both
# packages do have linux-aarch64 builds at the versions the x86_64-linux lock
# resolved to, so this file keeps the x86_64-linux versions:
#
#   pysam 0.22.0   kept (macOS needs 0.22.1). Verified present for linux-aarch64
#                  as pysam-0.22.0-py310hce31f46_1.tar.bz2.
#   pyvcf 0.6.8    kept (macOS needs the pyvcf3 fork). Verified present for
#                  linux-aarch64 as pyvcf-0.6.8-py310hbbe02a8_1003.conda.
#
# Both packages are genuinely imported (pysam by scorevariants/readers.py and
# encoders.py, vcf by gcnvkernel/postprocess/viterbi_segmentation.py), so neither
# could be dropped; here they simply do not have to be replaced.
#
# One substitution IS forced here and on no other platform:
#
#   scipy 1.11.4 -> 1.11.3   conda-forge never built scipy 1.11.4 for
#                            linux-aarch64 (`repoquery search --platform
#                            linux-aarch64 scipy==1.11.4` finds no entry, and the
#                            solve fails with "does not exist"). 1.11.3 is the
#                            newest 1.11.x that was built for this platform: one
#                            patch below the pin, same minor series.
#
# So this spec differs from the x86_64-linux one in the two MKL lines and in
# scipy; every other package keeps the exact version the x86_64-linux lock
# resolved to.
#
# gcnvkernel is NOT listed here: it ships in gatkPythonPackageArchive.zip and is
# pip-installed after the solve, the same split the [hook] uses.
name: gatk
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.10.13
  - conda-forge::pip=23.3.1
  - conda-forge::numpy=1.26.2
  - conda-forge::pymc=5.10.1
  - conda-forge::pytensor=2.18.3
  - conda-forge::scipy=1.11.3
  - conda-forge::h5py=3.10.0
  - conda-forge::pytorch=2.1.0
  - conda-forge::pytorch-lightning=2.4.0
  - conda-forge::scikit-learn=1.3.2
  - conda-forge::matplotlib=3.8.2
  - conda-forge::pandas=2.1.3
  - conda-forge::tqdm=4.66.1
  - conda-forge::dill=0.3.7
  - conda-forge::biopython=1.84
  - r-base=4.3.1
  - r-data.table=1.14.8
  - r-dplyr=1.1.3
  - r-getopt=1.20.4
  - r-ggplot2=3.4.4
  - r-gplots=3.1.3
  - r-gsalib=2.2.1
  - r-optparse=1.7.3
  - r-backports=1.4.1
  - bioconda::pysam=0.22.0
  - conda-forge::pyvcf=0.6.8
