schema-version = "1.13.0"

[install]
# Nothing is needed to build: the build only copies files. An [install] entry is
# required to publish, and coreutils is what the copy actually uses.
coreutils.pkg-path = "coreutils"

[build.gatkcondaenv]
description = "Conda locks and gcnvkernel archive for GATK's gatkcondaenv Python environment"
# 4.6.2.0 is the GATK release these locks belong to. The suffix is the short hash
# of the commit this content was built from, so that adding a lock for another
# platform, which does not change the GATK version, still publishes as a distinct
# version instead of colliding with what is already in the catalog.
#
# The hash is written by hand, NOT derived with `version.command = "git rev-parse
# --short HEAD"`, for two reasons:
#
#   1. Self-reference. The commit that introduces a hash cannot contain its own
#      hash, so a derived value would always name a different tree than the one
#      shipped. Pinning the parent commit is off by one on purpose, and honest
#      about it.
#   2. `sandbox = "pure"` copies only git-tracked files into the build, so .git is
#      not there to query.
#
# BUMP THIS when the packaged files change, e.g. when the aarch64-linux lock is
# added: set it to the short hash of HEAD just before that commit.
version = "4.6.2.0-bfcc0e6"
# Pure: these are git-tracked data files with no network or host dependency, so the
# build is fully reproducible and safe to publish (see FLOX.md section 9.2).
sandbox = "pure"
command = '''
  install -d "$out/share/gatkcondaenv"

  # Per-platform explicit conda locks. The consuming hook selects one by mapping
  # $(uname -s)-$(uname -m) to the flox system name.
  install -m 644 gatkcondaenv.x86_64-linux.lock    "$out/share/gatkcondaenv/"
  install -m 644 gatkcondaenv.aarch64-darwin.lock  "$out/share/gatkcondaenv/"

  # The Apple-Silicon-adapted spec the aarch64-darwin lock was solved from. Not
  # used at runtime; shipped so the lock can be regenerated or audited from the
  # package alone, without the repo.
  install -m 644 gatkcondaenv.macos.yml            "$out/share/gatkcondaenv/"

  # gcnvkernel + scorevariants. Not a conda or PyPI package: GATK ships it inside
  # its release, and the hook pip-installs it into the materialized conda env.
  install -m 644 gatkPythonPackageArchive.zip      "$out/share/gatkcondaenv/"

  # Clears the spurious executable-stack flag on conda-forge's libtorch_cpu.so.
  # NOT executable: the hook runs it as `"$gcnv/bin/python" clear-execstack.py`,
  # never directly, so the exec bit buys nothing and only trips flox's "executables
  # found outside of $out/bin" hint.
  install -m 644 clear-execstack.py                "$out/share/gatkcondaenv/"
'''

[options]
systems = [
  "x86_64-linux",
  "aarch64-linux",
  "aarch64-darwin",
]
