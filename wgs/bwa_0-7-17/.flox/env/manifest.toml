## BWA 0.7.17 — runtime Flox environment
## The catalog has bwa@0.7.17 for x86_64 only (it predates ARM support). To get
## the exact version on all four systems, we install the full-platform build
## published from build/bwa (native SSE2 on x86_64, sse2neon on aarch64).
##
## Resolves only AFTER a maintainer runs `flox publish -o flox-labs bwa` on each
## target platform. To finalize this env post-publish:  flox install -d . flox-labs/bwa
##
## Alternative (avoids republishing x86_64, which the catalog already has): keep
## `bwa.pkg-path = "bwa"` scoped to the x86_64 systems and add a second descriptor
## `bwa-arm.pkg-path = "flox-labs/bwa"` scoped to the aarch64 systems.
schema-version = "1.13.0"

[install]
bwa.pkg-path = "flox-labs/bwa"
bwa.version = "0.7.17"

[options]
systems = [
  "x86_64-linux",
  "aarch64-linux",
  "x86_64-darwin",
  "aarch64-darwin",
]
