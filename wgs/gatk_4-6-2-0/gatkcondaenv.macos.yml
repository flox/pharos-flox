# gatkcondaenv adapted for osx-arm64 (Apple Silicon).
#
# Derived from GATK 4.6.2.0's official gatkcondaenv.yml.template, with the two
# Intel-only lines dropped, as GATK's own comment invites ("if other versions
# are desired, users should edit this YML accordingly"):
#
#   - conda-forge::blas=1.0=mkl             MKL has no osx-arm64 build
#   - conda-forge::pytorch=2.1.0=*mkl*100   MKL-flavored build string, x86-only
#
# On osx-arm64 conda-forge's pytorch links Accelerate/OpenBLAS instead, so the
# BLAS pin is simply omitted and pytorch is pinned by version only.
#
# Two further substitutions are forced by what bioconda publishes for osx-arm64;
# both packages are genuinely imported (pysam by scorevariants/readers.py and
# encoders.py, vcf by gcnvkernel/postprocess/viterbi_segmentation.py), so neither
# can simply be dropped:
#
#   pysam 0.22.0 -> 0.22.1   0.22.0 has no osx-arm64 build; 0.22.1 is the oldest
#                            that does, a patch release with the same API.
#   pyvcf 0.6.8  -> pyvcf3   PyVCF is dead upstream and was never built for
#                            osx-arm64. pyvcf3 is its maintained fork and keeps
#                            the same top-level `vcf` module, so `import vcf`
#                            resolves unchanged.
#
# Every other package keeps the exact version the x86_64-linux lock resolved to.
#
# gcnvkernel is NOT listed here: it ships in gatkPythonPackageArchive.zip and is
# pip-installed after the solve, the same split the [hook] uses.
name: gatk
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.10.13
  - conda-forge::pip=23.3.1
  - conda-forge::numpy=1.26.2
  - conda-forge::pymc=5.10.1
  - conda-forge::pytensor=2.18.3
  - conda-forge::scipy=1.11.4
  - conda-forge::h5py=3.10.0
  - conda-forge::pytorch=2.1.0
  - conda-forge::pytorch-lightning=2.4.0
  - conda-forge::scikit-learn=1.3.2
  - conda-forge::matplotlib=3.8.2
  - conda-forge::pandas=2.1.3
  - conda-forge::tqdm=4.66.1
  - conda-forge::dill=0.3.7
  - conda-forge::biopython=1.84
  - r-base=4.3.1
  - r-data.table=1.14.8
  - r-dplyr=1.1.3
  - r-getopt=1.20.4
  - r-ggplot2=3.4.4
  - r-gplots=3.1.3
  - r-gsalib=2.2.1
  - r-optparse=1.7.3
  - r-backports=1.4.1
  - bioconda::pysam=0.22.1
  - bioconda::pyvcf3=1.0.4
