    "build": {
      "gatkcondaenv": {
        "command": "  install -d \"$out/share/gatkcondaenv\"\n\n  # Per-platform explicit conda locks. The consuming hook selects one by mapping\n  # $(uname -s)-$(uname -m) to the flox system name.\n  install -m 644 gatkcondaenv.x86_64-linux.lock    \"$out/share/gatkcondaenv/\"\n  install -m 644 gatkcondaenv.aarch64-linux.lock   \"$out/share/gatkcondaenv/\"\n  install -m 644 gatkcondaenv.aarch64-darwin.lock  \"$out/share/gatkcondaenv/\"\n\n  # The ported specs the two aarch64 locks were solved from, each dropping the\n  # Intel-only MKL pins that GATK's own template carries. Not used at runtime;\n  # shipped so a lock can be regenerated or audited from the package alone,\n  # without the repo. There is no spec for x86_64-linux because that lock solves\n  # from GATK's unmodified template.\n  install -m 644 gatkcondaenv.macos.yml            \"$out/share/gatkcondaenv/\"\n  install -m 644 gatkcondaenv.aarch64-linux.yml    \"$out/share/gatkcondaenv/\"\n\n  # gcnvkernel + scorevariants. Not a conda or PyPI package: GATK ships it inside\n  # its release, and the hook pip-installs it into the materialized conda env.\n  install -m 644 gatkPythonPackageArchive.zip      \"$out/share/gatkcondaenv/\"\n\n  # Clears the spurious executable-stack flag on conda-forge's libtorch_cpu.so.\n  # NOT executable: the hook runs it as `\"$gcnv/bin/python\" clear-execstack.py`,\n  # never directly, so the exec bit buys nothing and only trips flox's \"executables\n  # found outside of $out/bin\" hint.\n  install -m 644 clear-execstack.py                \"$out/share/gatkcondaenv/\"\n",
        "sandbox": "pure",
        "version": "4.6.2.0-0000e63",
        "description": "Conda locks and gcnvkernel archive for GATK's gatkcondaenv Python environment"
      }
    }
  },
